{% extends "base.html" %}
{% block title %}Register — Librarium{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <div style="font-size:2rem;margin-bottom:.5rem">✍️</div>
      <h2>Create an account</h2>
      <p>Join Librarium and start reading</p>
    </div>

    <form method="POST" action="{{ url_for('main.register') }}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input id="username" name="username" type="text" class="form-input" placeholder="Choose a username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input id="email" name="email" type="email" class="form-input" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" name="password" type="password" class="form-input" placeholder="At least 6 characters" required minlength="6">
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input id="confirm_password" name="confirm_password" type="password" class="form-input" placeholder="Repeat your password" required>
      </div>
      <button type="submit" class="btn btn-primary w-full" style="justify-content:center;margin-top:.5rem">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('main.login') }}">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
