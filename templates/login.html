{% extends "base.html" %}
{% block title %}Log In — Librarium{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <div style="font-size:2rem;margin-bottom:.5rem">📖</div>
      <h2>Welcome back</h2>
      <p>Sign in to access your library</p>
    </div>

    <form method="POST" action="{{ url_for('main.login') }}">
      <div class="form-group">
        <label class="form-label" for="identifier">Username or Email</label>
        <input id="identifier" name="identifier" type="text" class="form-input" placeholder="Enter username or email" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" name="password" type="password" class="form-input" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary w-full" style="justify-content:center;margin-top:.5rem">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="{{ url_for('main.register') }}">Create one free</a>
    </div>

    <div class="divider"></div>
    <p class="text-xs text-muted" style="text-align:center">
      Demo &mdash; Admin: <code style="color:var(--accent)">admin / admin123</code><br>
      Member: <code style="color:var(--accent)">alice / alice123</code>
    </p>
  </div>
</div>
{% endblock %}
